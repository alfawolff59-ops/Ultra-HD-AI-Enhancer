
name: Android APK Derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: UltraHDAIEnhancer/android
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: gradle --no-daemon assembleDebug -PSERVER_URL="${SERVER_URL:-https://YOUR-SERVER.example/}"

      - uses: actions/upload-artifact@v4
        with:
          name: UltraHDAIEnhancer-APK
          path: UltraHDAIEnhancer/android/app/build/outputs/apk/debug/app-debug.apk
